name: Build & Release

# Construit l'installeur Windows (NSIS, RoAccount_x.y.z_x64-setup.exe).
#  - push d'un tag `vX.Y.Z`  -> build + Release GitHub avec le setup .exe
#  - lancement manuel         -> build seulement (le .exe est dispo en artefact)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Release (tag v*) : publie le setup .exe sur la page Releases
      - name: Build + publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RoAccount ${{ github.ref_name }}
          releaseBody: |
            Installeur Windows : télécharge **RoAccount_*_x64-setup.exe** ci-dessous.

            > Windows SmartScreen peut afficher « Windows a protégé votre PC » car l'appli n'est pas encore signée : clique sur *Informations complémentaires* puis *Exécuter quand même*.
          releaseDraft: false
          prerelease: false

      # Lancement manuel : build simple + artefact
      - name: Build (sans release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build

      - name: Upload setup (build manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: RoAccount-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
