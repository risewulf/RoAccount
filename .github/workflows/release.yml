name: Build & Release

# Builds the Windows installer (NSIS, RoAccount_x.y.z_x64-setup.exe).
#  - push of a `vX.Y.Z` tag -> build, sign (if configured) and publish a GitHub Release
#  - manual run              -> build (and sign, if configured); the .exe is kept as an artifact
#
# Code signing (free for open source via SignPath Foundation, https://signpath.org):
# signing is skipped until the repository variable SIGNPATH_ORGANIZATION_ID is set.
# Setup, once the SignPath application is approved:
#   - Variables: SIGNPATH_ORGANIZATION_ID (+ optional SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG)
#   - Secret:    SIGNPATH_API_TOKEN
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        run: npm run tauri build

      - name: Locate installer
        id: pkg
        shell: bash
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: ${{ steps.pkg.outputs.path }}

      # Optional: code signing with SignPath (skipped when not configured)
      - name: Sign installer (SignPath)
        id: sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'RoAccount' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Pick file to publish
        id: final
        shell: bash
        run: |
          if [ -d signed ] && ls signed/*.exe >/dev/null 2>&1; then
            echo "path=$(ls signed/*.exe | head -n 1)" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.pkg.outputs.path }}" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RoAccount-setup
          path: ${{ steps.final.outputs.path }}

      # Release (tag v*): publishes the setup .exe on the Releases page
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.final.outputs.path }}
          SIGNED: ${{ steps.final.outputs.signed }}
        run: |
          cat > notes.md <<'EOF'
          Windows installer: download **RoAccount_*_x64-setup.exe** below and run it.

          > If Windows SmartScreen shows "Windows protected your PC", click *More info* then *Run anyway*.

          **Important:** close every Roblox client before starting RoAccount, otherwise multi-client will not work.
          EOF
          if [ "$SIGNED" != "true" ]; then
            printf '\n> This build is not code-signed yet, so Windows shows "Unknown publisher".\n' >> notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "RoAccount $TAG" --notes-file notes.md --verify-tag
          fi
