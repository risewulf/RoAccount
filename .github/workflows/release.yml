name: Build & Release

# Builds the Windows installer (NSIS, RoAccount_x.y.z_x64-setup.exe).
#  - push of a `vX.Y.Z` tag -> build + GitHub Release with the setup .exe
#  - manual run              -> build only (the .exe is available as an artifact)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Release (tag v*): publishes the setup .exe on the Releases page
      - name: Build + publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RoAccount ${{ github.ref_name }}
          releaseBody: |
            Windows installer: download **RoAccount_*_x64-setup.exe** below.

            > Windows SmartScreen may show "Windows protected your PC" because the app is not code-signed yet: click *More info* then *Run anyway*.
          releaseDraft: false
          prerelease: false

      # Manual run: plain build + artifact
      - name: Build (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build

      - name: Upload setup (manual build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: RoAccount-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
